# Block ids for the geometry programs (mc_Entity.x in the vertex shader).
# 10001 = foliage: lit as thin, light-scattering material (lib/lighting.glsl).
# 10002 = emissive: lit normally, then its own colour is added on top (Emissive Glow).
# 10003 = grass plants: lit as foliage; their shadows can be turned off (Grass Casts Shadows).
# 10004 = water: reflects the sky (gbuffers_water).
block.10001=#minecraft:leaves oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves dark_oak_leaves mangrove_leaves cherry_leaves azalea_leaves flowering_azalea_leaves pale_oak_leaves vine
block.10002=lava magma_block glowstone sea_lantern shroomlight jack_o_lantern lantern soul_lantern torch wall_torch soul_torch soul_wall_torch fire soul_fire end_rod ochre_froglight pearlescent_froglight verdant_froglight beacon crying_obsidian
block.10003=short_grass tall_grass fern large_fern bush short_dry_grass tall_dry_grass
block.10004=water
# 10005 = thin blocks that are not foliage (litter, roots, flowers, panes, bars, chains, fences, doors, rails...):
#         lit normally, but their back faces are not thickened in the shadow pass,
#         which would make them shadow their own sunlit side.
block.10005=leaf_litter glass_pane iron_bars chain iron_chain copper_chain exposed_copper_chain weathered_copper_chain oxidized_copper_chain waxed_copper_chain waxed_exposed_copper_chain waxed_weathered_copper_chain waxed_oxidized_copper_chain copper_bars exposed_copper_bars weathered_copper_bars oxidized_copper_bars waxed_copper_bars waxed_exposed_copper_bars waxed_weathered_copper_bars waxed_oxidized_copper_bars lightning_rod pointed_dripstone ladder scaffolding lever tripwire tripwire_hook redstone_wire repeater comparator snow moss_carpet #minecraft:fences #minecraft:fence_gates #minecraft:rails #minecraft:buttons #minecraft:pressure_plates #minecraft:trapdoors #minecraft:doors #minecraft:all_signs #minecraft:wool_carpets #minecraft:candles #minecraft:banners bamboo bamboo_sapling mangrove_roots muddy_mangrove_roots pink_petals wildflowers dandelion poppy blue_orchid allium azure_bluet red_tulip orange_tulip white_tulip pink_tulip oxeye_daisy cornflower lily_of_the_valley torchflower wither_rose sunflower lilac rose_bush peony oak_sapling spruce_sapling birch_sapling jungle_sapling acacia_sapling dark_oak_sapling cherry_sapling pale_oak_sapling mangrove_propagule dead_bush sweet_berry_bush sugar_cane cobweb lily_pad seagrass tall_seagrass kelp kelp_plant hanging_roots glow_lichen moss_carpet pale_moss_carpet firefly_bush cactus_flower small_dripleaf big_dripleaf big_dripleaf_stem spore_blossom closed_eyeblossom open_eyeblossom
