# No <empty> slots: they show up as blank buttons in the menu.
screen=[EFFECTS] [LIGHT] [SHADOWS] [ATMOS] [GRADE] [MIXER] [CALIB] [GLOW] [LENS] [GRAIN_PAGE] [DEBUG_PAGE]
screen.columns=2

screen.EFFECTS=ENABLE_BLOOM ENABLE_DIFFUSION ENABLE_HAZE ENABLE_GODRAYS ENABLE_GRAIN ENABLE_FXAA
screen.LIGHT=SUN_INTENSITY AMBIENT_INTENSITY BLOCKLIGHT_INTENSITY EMISSIVE_GLOW HIGHLIGHT_KNEE SURFACE_SHEEN MOON_BRIGHTNESS AO_STRENGTH
screen.SHADOWS=ENABLE_SHADOWS SHADOW_DISTANCE SHADOW_RESOLUTION SHADOW_SAMPLES SHADOW_SOFTNESS SHADOW_ENTITIES SHADOW_GRASS
screen.SHADOWS.columns=1
screen.ATMOS=HAZE_AMOUNT HAZE_SUN_GLOW CLOUD_DISTANCE GODRAY_STRENGTH GODRAY_SAMPLES
screen.GRADE=EXPOSURE CONTRAST BLACK_LIFT SATURATION VIBRANCE CHROMA_LIMIT SHADOW_TINT HIGHLIGHT_TINT
screen.CALIB=CAL_RED CAL_GREEN CAL_BLUE
screen.CALIB.columns=3
screen.MIXER=RED_H RED_S RED_L ORANGE_H ORANGE_S ORANGE_L YELLOW_H YELLOW_S YELLOW_L GREEN_H GREEN_S GREEN_L AQUA_H AQUA_S AQUA_L BLUE_H BLUE_S BLUE_L PURPLE_H PURPLE_S PURPLE_L MAGENTA_H MAGENTA_S MAGENTA_L
screen.MIXER.columns=3
screen.GLOW=BLOOM_STRENGTH BLOOM_THRESHOLD DIFFUSION
screen.GLOW.columns=3
screen.LENS=VIGNETTE CHROMA_FRINGE
screen.GRAIN_PAGE=GRAIN_AMOUNT GRAIN_SIZE GRAIN_SPEED
screen.GRAIN_PAGE.columns=3
screen.DEBUG_PAGE=DEBUG_VIEW
screen.DEBUG_PAGE.columns=1

sliders=SHADOW_DISTANCE SHADOW_RESOLUTION SHADOW_SAMPLES SHADOW_SOFTNESS SUN_INTENSITY AMBIENT_INTENSITY BLOCKLIGHT_INTENSITY EMISSIVE_GLOW HIGHLIGHT_KNEE SURFACE_SHEEN MOON_BRIGHTNESS AO_STRENGTH HAZE_AMOUNT HAZE_SUN_GLOW CLOUD_DISTANCE GODRAY_STRENGTH GODRAY_SAMPLES DEBUG_VIEW EXPOSURE CONTRAST BLACK_LIFT SATURATION VIBRANCE CHROMA_LIMIT SHADOW_TINT HIGHLIGHT_TINT CAL_RED CAL_GREEN CAL_BLUE RED_H RED_S RED_L ORANGE_H ORANGE_S ORANGE_L YELLOW_H YELLOW_S YELLOW_L GREEN_H GREEN_S GREEN_L AQUA_H AQUA_S AQUA_L BLUE_H BLUE_S BLUE_L PURPLE_H PURPLE_S PURPLE_L MAGENTA_H MAGENTA_S MAGENTA_L BLOOM_STRENGTH BLOOM_THRESHOLD DIFFUSION VIGNETTE CHROMA_FRINGE GRAIN_AMOUNT GRAIN_SIZE GRAIN_SPEED

# Bloom chain lives in lower-resolution buffers (relative to screen size).
size.buffer.colortex4=0.5 0.5
size.buffer.colortex5=0.125 0.125
size.buffer.colortex9=0.125 0.125
size.buffer.colortex10=0.5 0.5
size.buffer.colortex11=0.5 0.5

# Skip the bloom/diffusion passes entirely when nothing needs them.
program.composite1.enabled=ENABLE_BLOOM || ENABLE_DIFFUSION || ENABLE_GODRAYS
program.composite2.enabled=ENABLE_BLOOM || ENABLE_DIFFUSION

# Terrain vertex AO arrives in gl_Color.a instead of being baked into rgb.
separateAo=true

# The hand is solid: write it over the scene with no blending.
blend.gbuffers_hand=off
# Sun and moon add onto the sky (vanilla does the same), so the texture's
# dark padding adds nothing and rain fades them out cleanly.
blend.gbuffers_skytextured=ONE ONE ONE ONE

# The shadow pass (extra geometry draw) only exists when shadows are on.
program.shadow.enabled=ENABLE_SHADOWS
# Cheapest caster set: opaque terrain only. We sample the opaque depth
# (shadowtex1), so translucents, block entities and the player are skipped.
shadowTerrain=true
shadowTranslucent=false
shadowBlockEntities=false
shadowPlayer=false
shadow.culling=true
#ifdef SHADOW_ENTITIES
shadowEntities=true
#else
shadowEntities=false
#endif
