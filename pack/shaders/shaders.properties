# No <empty> slots: they show up as blank buttons in the menu.
screen=[EFFECTS] [LIGHT] [ATMOS] [GRADE] [MIXER] [CALIB] [GLOW] [LENS] [GRAIN_PAGE] [DEBUG_PAGE]
screen.columns=2

screen.EFFECTS=ENABLE_BLOOM ENABLE_DIFFUSION ENABLE_HAZE ENABLE_GRAIN ENABLE_FXAA
screen.LIGHT=SUN_INTENSITY AMBIENT_INTENSITY BLOCKLIGHT_INTENSITY HIGHLIGHT_KNEE MOON_BRIGHTNESS AO_STRENGTH
screen.ATMOS=HAZE_AMOUNT HAZE_SUN_GLOW
screen.GRADE=EXPOSURE CONTRAST BLACK_LIFT SATURATION VIBRANCE CHROMA_LIMIT SHADOW_TINT HIGHLIGHT_TINT
screen.CALIB=CAL_RED CAL_GREEN CAL_BLUE
screen.CALIB.columns=3
screen.MIXER=RED_H RED_S RED_L ORANGE_H ORANGE_S ORANGE_L YELLOW_H YELLOW_S YELLOW_L GREEN_H GREEN_S GREEN_L AQUA_H AQUA_S AQUA_L BLUE_H BLUE_S BLUE_L PURPLE_H PURPLE_S PURPLE_L MAGENTA_H MAGENTA_S MAGENTA_L
screen.MIXER.columns=3
screen.GLOW=BLOOM_STRENGTH BLOOM_THRESHOLD DIFFUSION
screen.GLOW.columns=3
screen.LENS=VIGNETTE CHROMA_FRINGE
screen.GRAIN_PAGE=GRAIN_AMOUNT GRAIN_SIZE GRAIN_SPEED
screen.GRAIN_PAGE.columns=3
screen.DEBUG_PAGE=DEBUG_VIEW
screen.DEBUG_PAGE.columns=1

sliders=SUN_INTENSITY AMBIENT_INTENSITY BLOCKLIGHT_INTENSITY HIGHLIGHT_KNEE MOON_BRIGHTNESS AO_STRENGTH HAZE_AMOUNT HAZE_SUN_GLOW DEBUG_VIEW EXPOSURE CONTRAST BLACK_LIFT SATURATION VIBRANCE CHROMA_LIMIT SHADOW_TINT HIGHLIGHT_TINT CAL_RED CAL_GREEN CAL_BLUE RED_H RED_S RED_L ORANGE_H ORANGE_S ORANGE_L YELLOW_H YELLOW_S YELLOW_L GREEN_H GREEN_S GREEN_L AQUA_H AQUA_S AQUA_L BLUE_H BLUE_S BLUE_L PURPLE_H PURPLE_S PURPLE_L MAGENTA_H MAGENTA_S MAGENTA_L BLOOM_STRENGTH BLOOM_THRESHOLD DIFFUSION VIGNETTE CHROMA_FRINGE GRAIN_AMOUNT GRAIN_SIZE GRAIN_SPEED

# Bloom chain lives in lower-resolution buffers (relative to screen size).
size.buffer.colortex4=0.5 0.5
size.buffer.colortex5=0.125 0.125
size.buffer.colortex6=0.03125 0.03125
size.buffer.colortex9=0.125 0.125
size.buffer.colortex10=0.5 0.5

# Skip the bloom/diffusion passes entirely when nothing needs them.
program.composite1.enabled=ENABLE_BLOOM || ENABLE_DIFFUSION
program.composite2.enabled=ENABLE_BLOOM || ENABLE_DIFFUSION
program.composite3.enabled=ENABLE_BLOOM

# Terrain vertex AO arrives in gl_Color.a instead of being baked into rgb.
separateAo=true

# Clouds blend into colortex0 as usual, but write their tag to colortex1 as-is.
blend.gbuffers_clouds.colortex1=off
# Cloud alpha is written as 0 (rgb blends normally) so composite can tell
# clouds apart without reading colortex1.
blend.gbuffers_clouds.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ZERO
# The hand is solid: write it over the scene with no blending.
blend.gbuffers_hand=off

# Atmosphere runs before bloom and FXAA so anti-aliased edges are fogged too.
program.composite.enabled=ENABLE_HAZE
